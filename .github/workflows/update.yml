name: Update alerts
on:
  schedule:
    - cron: "0 19 * * *" # 03:00 Taiwan time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_alerts.py alerts.json
      - name: Commit if changed
        run: |
          if git diff --quiet -- alerts.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alerts.json
          git commit -m "Update alerts $(date -u +%F)"
          git push
